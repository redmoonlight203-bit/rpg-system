<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d">
  <title id="t">YUGEN</title>
  <desc id="d">Kuroi, un gato negro como el vacío, con ojos blancos y una sonrisa, sentado sobre dados de rol y el nombre YUGEN.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d5a7"/>
      <stop offset="1" stop-color="#a67d43"/>
    </linearGradient>
  </defs>

  <!-- halo arcano -->
  <circle cx="200" cy="190" r="170" fill="url(#halo)"/>

  <!-- cola -->
  <path d="M250 330 C320 335 370 300 365 240 C362 210 345 200 340 215 C350 255 330 285 262 296 Z" fill="#07060b" stroke="#2a2440" stroke-width="1.5"/>

  <!-- cuerpo sentado -->
  <path d="M150 226 C128 262 116 300 118 336 L282 336 C284 300 272 262 250 226 Z" fill="#07060b" stroke="#2a2440" stroke-width="1.5"/>
  <!-- patas delanteras -->
  <path d="M168 330 L168 300 Q168 292 176 292 L192 292 Q200 292 200 300 L200 336 Z" fill="#0b0a12"/>
  <path d="M200 330 L200 300 Q200 292 208 292 L224 292 Q232 292 232 300 L232 336 Z" fill="#0b0a12"/>

  <!-- cabeza -->
  <path d="M142 150 L128 62 L186 120 Q200 116 214 120 L272 62 L258 150 C280 168 284 206 262 226 C246 242 154 242 138 226 C116 206 120 168 142 150 Z" fill="#07060b" stroke="#2a2440" stroke-width="1.5"/>
  <!-- interior de orejas -->
  <path d="M146 142 L140 92 L172 124 Z" fill="#17131f"/>
  <path d="M254 142 L260 92 L228 124 Z" fill="#17131f"/>

  <!-- ojos blancos -->
  <ellipse cx="170" cy="184" rx="15" ry="11" fill="#f7f3ea"/>
  <ellipse cx="230" cy="184" rx="15" ry="11" fill="#f7f3ea"/>
  <!-- pupilas: rendijas oscuras -->
  <ellipse cx="171" cy="184" rx="3" ry="9" fill="#07060b"/>
  <ellipse cx="229" cy="184" rx="3" ry="9" fill="#07060b"/>

  <!-- nariz y sonrisa -->
  <path d="M195 204 L205 204 L200 210 Z" fill="#7c5cff"/>
  <path d="M164 216 Q200 252 236 216" fill="none" stroke="#f7f3ea" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M176 222 Q200 240 224 222" fill="#f7f3ea" opacity=".9"/>
  <!-- bigotes -->
  <path d="M132 214 L100 208 M132 224 L100 226 M268 214 L300 208 M268 224 L300 226" stroke="#a9a3bb" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>

  <!-- borde de luz (carmesí, discreto) -->
  <path d="M258 150 C280 168 284 206 262 226" fill="none" stroke="#b3122e" stroke-width="1.6" opacity=".7"/>

  <!-- dado d20 (izquierda) -->
  <g transform="translate(78 322)">
    <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="#0f0d16" stroke="#c7a46a" stroke-width="1.6"/>
    <polyline points="-30,-17 0,0 30,-17 M0,0 0,34" fill="none" stroke="#c7a46a" stroke-width=".9" opacity=".7"/>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#f1d5a7">20</text>
  </g>
  <!-- dado d12 (derecha) -->
  <g transform="translate(322 318)">
    <polygon points="0,-30 22,-20 28,4 14,24 -14,24 -28,4 -22,-20" fill="#0f0d16" stroke="#c7a46a" stroke-width="1.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#f1d5a7">12</text>
  </g>

  <!-- nombre -->
  <text x="200" y="384" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="46" font-weight="700" letter-spacing="8" fill="url(#oro)" stroke="#07060b" stroke-width="2" paint-order="stroke">YUGEN</text>
</svg>
