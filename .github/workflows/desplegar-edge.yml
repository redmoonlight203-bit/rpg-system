name: Desplegar funciones de combate
# Publica en Supabase las funciones que usan el motor de combate cada vez que cambia en main.
# El motor se regenera aquí desde lib/combate.ts, así coincide con lo que guarda «Sincronizar motor Edge»
# (un push hecho por ese flujo no dispara otros flujos de GitHub).
on:
  push:
    branches: [main]
    paths:
      - 'lib/combate.ts'
      - 'lib/transformaciones.ts'
      - 'scripts/preparar-motor-edge.mjs'
      - 'supabase/functions/equipo-combate/**'
      - 'supabase/functions/combate-jugador/**'
      - 'supabase/functions/arena-yugen/**'
      - '.github/workflows/desplegar-edge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desplegar-edge
  cancel-in-progress: false
env:
  PROYECTO_SUPABASE: yzvpahcjbuotnqjmbkeu
jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generar motor Edge desde TypeScript
        run: node scripts/preparar-motor-edge.mjs
      - name: Probar el motor antes de publicarlo
        run: node --test tests/*.test.mjs
      - name: Comprobar el token de Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Desplegar equipo-combate, combate-jugador y arena-yugen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Las tres funciones hacen su propia autenticación: se mantienen sin verificación JWT, como están en producción.
        run: |
          sha256sum supabase/functions/equipo-combate/motor.js
          for funcion in equipo-combate combate-jugador arena-yugen; do
            supabase functions deploy "$funcion" --project-ref "$PROYECTO_SUPABASE" --no-verify-jwt --use-api
          done
